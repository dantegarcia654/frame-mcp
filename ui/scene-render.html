<!doctype html>
<html><head><meta charset="utf-8"><title>Frame scene renderer</title></head>
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script type="module">
// Headless page used by src/scenes.js: draws scene clips frame by frame with the same ui/scene-draw.js as the window.
import { drawScene, loadSceneFonts } from './scene-draw.js';
const cv = document.getElementById('c');
let ctx = null, clip = null;
window.__ready = (async () => { await loadSceneFonts('.'); await document.fonts.ready; return true; })();
window.__setup = (c, W, H) => { clip = c; cv.width = W; cv.height = H; ctx = cv.getContext('2d'); return true; };
window.__draw = (lt, T, type, q) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  drawScene(ctx, clip, lt, cv.width, cv.height, T);
  return cv.toDataURL(type, q);
};
</script>
</body></html>
